<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Lost & Found System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <h1>🔍 Campus Lost &amp; Found</h1>
        <p>Report lost belongings, claim found items, and track resolutions in real time.</p>
      </div>
      <button type="button" id="toggle-form-btn" class="btn btn-primary" onclick="toggleFormVisibility()">
        + Report Item
      </button>
    </header>

    <!-- Notification Toast / Alert -->
    <div id="notification" role="alert" aria-live="polite"></div>

    <!-- Quick Stats & Filter Tabs -->
    <div class="stats-bar">
      <button type="button" class="stat-pill active" data-status="" onclick="setFilterStatus('')">
        All Items <span id="count-all" class="pill-badge">0</span>
      </button>
      <button type="button" class="stat-pill" data-status="Lost" onclick="setFilterStatus('Lost')">
        🔴 Lost <span id="count-lost" class="pill-badge">0</span>
      </button>
      <button type="button" class="stat-pill" data-status="Found" onclick="setFilterStatus('Found')">
        🟢 Found <span id="count-found" class="pill-badge">0</span>
      </button>
      <button type="button" class="stat-pill" data-status="Resolved" onclick="setFilterStatus('Resolved')">
        ✅ Resolved <span id="count-resolved" class="pill-badge">0</span>
      </button>
    </div>

    <!-- Section 1: Add / Edit Item Form (Collapsible/Clean) -->
    <section id="form-section" class="card form-card" aria-labelledby="form-heading">
      <div class="card-header">
        <h2 id="form-heading">Report Lost or Found Item</h2>
        <span class="card-subtitle">Fill in the item details below</span>
      </div>

      <form id="item-form" novalidate>
        <div class="form-grid">
          <div class="form-group">
            <label for="item-title">Item Name / Title *</label>
            <input type="text" id="item-title" name="title" placeholder="e.g. Casio Scientific Calculator" required>
          </div>

          <div class="form-group">
            <label for="item-category">Category *</label>
            <select id="item-category" name="category" required>
              <option value="Electronics">Electronics (Laptop, Phone, Charger)</option>
              <option value="Stationery">Stationery (Calculator, Book, Pen)</option>
              <option value="ID Card / Documents">ID Card / College Pass / Documents</option>
              <option value="Wallet / Bag">Wallet / Backpack / Purse</option>
              <option value="Keys">Keys (Room, Bike, Car)</option>
              <option value="Clothing">Clothing / Water Bottle / Accessories</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="item-status">Status *</label>
            <select id="item-status" name="status" required>
              <option value="Lost">Lost (Looking for it)</option>
              <option value="Found">Found (Someone handed it over)</option>
              <option value="Resolved">Resolved (Returned to owner)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="item-location">Location *</label>
            <input type="text" id="item-location" name="location" placeholder="e.g. Central Library 2nd Floor" required>
          </div>

          <div class="form-group">
            <label for="item-date">Date *</label>
            <input type="date" id="item-date" name="date" required>
          </div>

          <div class="form-group">
            <label for="item-contact">Contact Info (Phone / Email) *</label>
            <input type="text" id="item-contact" name="contact" placeholder="e.g. 9876543210 or name@college.edu" required>
          </div>

          <div class="form-group full-width">
            <label for="item-description">Description / Identifying Marks (Optional)</label>
            <input type="text" id="item-description" name="description" placeholder="e.g. Blue sticker on the back, black zipped case">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn btn-primary">Submit Report</button>
          <button type="button" id="cancel-edit-btn" class="btn btn-secondary" onclick="resetFormToCreateMode()">Cancel</button>
        </div>
      </form>
    </section>

    <!-- Section 2: Search & Filter Toolbar -->
    <section class="card toolbar-card" aria-label="Search and Filter">
      <div class="search-bar-container">
        <div class="search-input-wrapper">
          <span class="search-icon">🔎</span>
          <input 
            type="search" 
            id="search-input" 
            placeholder="Search by title, location, category, or keyword..."
            autocomplete="off"
          >
        </div>
        <button type="button" id="clear-search-btn" class="btn btn-secondary" title="Clear search">
          Clear
        </button>
      </div>
    </section>

    <!-- Section 3: Reported Items Directory -->
    <section class="card table-card" aria-labelledby="list-heading">
      <div class="table-header-row">
        <h2 id="list-heading">
          Directory <span id="item-count" class="badge-count">0 items</span>
        </h2>
        <span id="active-filter-label" class="filter-indicator">Showing all items</span>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th style="width: 110px;">Status</th>
              <th>Item Name</th>
              <th>Category</th>
              <th>Location</th>
              <th>Date</th>
              <th>Contact</th>
              <th style="width: 220px; text-align: center;">Actions</th>
            </tr>
          </thead>
          <tbody id="items-table-body">
            <tr>
              <td colspan="7" class="empty-state">Loading items from database...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
